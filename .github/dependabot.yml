version: 2
updates:
  # Re-enable Bun updates after dependabot-core#15850 fixes npm aliases.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 3
